[build-system]
requires = ["setuptools>=68", "wheel", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "soemx"
version = "0.1.0"
description = "Cython bindings for SOEM with EoE support"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "soemx contributors"}]
dependencies = []

[tool.setuptools]
packages = ["soemx"]
