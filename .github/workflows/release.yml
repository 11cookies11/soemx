name: Release package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and SOEM
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build auditwheel

      - name: Install Linux native dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Generate SOEM build configuration
        run: cmake -S vendor/SOEM -B vendor/SOEM/build -DEC_DEBUG=OFF

      - name: Build distributions
        run: python -m build

      - name: Repair Linux wheel
        run: auditwheel repair dist/*.whl -w wheelhouse

      - name: Check distributions
        run: python -m pip install twine && python -m twine check dist/*.tar.gz wheelhouse/*.whl

      - name: Upload distributions
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --skip-existing dist/*.tar.gz wheelhouse/*.whl
